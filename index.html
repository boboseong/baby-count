<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>아기 숫자 놀이</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E%F0%9F%8D%8E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">숫자 놀이</p>
      <button id="fullscreen-button" class="secondary-button" type="button" aria-pressed="false">전체화면</button>
    </header>

    <section id="mode-step" class="panel active" aria-labelledby="mode-step-title">
      <h2 id="mode-step-title">어떤 방식으로 놀까요?</h2>
      <p class="mode-note">보호자가 골라 주세요.</p>

      <div class="mode-list">
        <button id="mode-classic" class="mode-card" type="button">
          <span class="mode-card-title">기존 방식 <span class="mode-card-tag">1.1</span></span>
          <span class="mode-card-desc">앱이 세어 주고, 아이가 정답 숫자를 고릅니다.</span>
        </button>

        <div class="mode-card-group">
          <button id="mode-touch" class="mode-card mode-card--primary" type="button">
            <span class="mode-card-title">새 방식</span>
            <span class="mode-card-desc">아이가 물체를 하나씩 짚어 셉니다.</span>
          </button>

          <div class="mode-settings">
            <div class="mode-setting">
              <span class="mode-setting-label">세는 개수</span>
              <div id="count-options" class="mode-setting-options" role="group" aria-label="세는 개수"></div>
            </div>
            <div class="mode-setting">
              <span class="mode-setting-label">물체 배치</span>
              <div id="layout-options" class="mode-setting-options" role="group" aria-label="물체 배치"></div>
            </div>
            <div class="mode-setting">
              <span class="mode-setting-label">확인 문제</span>
              <div id="quiz-type-options" class="mode-setting-options" role="group" aria-label="확인 문제 형식"></div>
            </div>
            <div class="mode-setting">
              <span class="mode-setting-label">틀렸을 때 기다리기</span>
              <div id="penalty-options" class="mode-setting-options" role="group" aria-label="틀렸을 때 기다리는 시간"></div>
            </div>
          </div>

          <div class="progress-block">
            <div class="progress-head">
              <h3 class="progress-title">수행 기록</h3>
              <button id="clear-progress" class="secondary-button" type="button">기록 지우기</button>
            </div>
            <p id="progress-summary" class="progress-summary"></p>
            <div class="progress-filter">
              <span class="mode-setting-label">유형</span>
              <div id="progress-type-filter" class="mode-setting-options" role="group" aria-label="기록을 볼 문제 유형"></div>
            </div>
            <p class="progress-caption">유형별 정답률</p>
            <div id="type-accuracy" class="type-accuracy"></div>
            <p class="progress-caption">숫자별 정답률</p>
            <div id="number-accuracy" class="number-accuracy"></div>
            <div id="trend-chart" class="trend-chart"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="item-step" class="panel" aria-labelledby="item-step-title" hidden>
      <h2 id="item-step-title">무엇을 셀까요?</h2>
      <div id="item-groups" class="item-groups"></div>
    </section>

    <section id="play-step" class="panel" aria-labelledby="play-step-title" hidden>
      <div class="panel-head">
        <div>
          <h2 id="play-step-title">몇 개일까요?</h2>
          <p id="result-label" class="selected-item-label"></p>
        </div>
      </div>
      <div id="object-stage" class="object-stage" aria-live="polite"></div>
      <div id="answer-grid" class="answer-grid" aria-label="정답 숫자 선택"></div>
      <div id="tally-strip" class="tally-strip" aria-hidden="true" hidden></div>
      <p id="status-text" class="status-text"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
